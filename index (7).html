<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primate Purpose Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --jungle:#0d3b2c; --jungle2:#155e43; --leaf:#2a9d6a;
  --cream:#fffaf0; --card:#ffffff; --ink:#1d2b26; --muted:#5b6b64;
  --banana:#ffd23f; --coral:#ff6b6b; --sky:#4cc9f0; --grape:#9b5de5; --mint:#06d6a0; --orange:#ff9f1c;
  --good:#0f9d58; --goodbg:#e3f8ec; --bad:#d64545; --badbg:#fde8e8; --hint:#fff4d1;
  --r:18px; --shadow:0 6px 0 rgba(0,0,0,.18), 0 12px 24px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#0d3b2c}
body{overflow-x:hidden; position:relative}
body{
  font-family:'Lexend',system-ui,sans-serif; font-size:19px; line-height:1.6; color:var(--ink);
  background:
    radial-gradient(circle at 8% 12%, rgba(42,157,106,.55) 0 120px, transparent 121px),
    radial-gradient(circle at 92% 30%, rgba(42,157,106,.45) 0 160px, transparent 161px),
    radial-gradient(circle at 20% 90%, rgba(42,157,106,.4) 0 180px, transparent 181px),
    linear-gradient(160deg, var(--jungle) 0%, var(--jungle2) 55%, #0b3326 100%);
  background-attachment:fixed; min-height:100vh; touch-action:manipulation;
}
button{font-family:inherit; font-size:inherit; cursor:pointer; touch-action:manipulation}
h1,h2,h3{font-family:'Fredoka',sans-serif; line-height:1.2; margin:0 0 .4em}

/* ---------- top bar ---------- */
.topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 16px; background:rgba(8,40,29,.92); backdrop-filter:blur(6px); color:#fff; border-bottom:3px solid var(--banana)}
.brand{font-family:'Fredoka'; font-weight:700; font-size:1.2rem; letter-spacing:.3px; white-space:nowrap}
.hud{display:flex; align-items:center; gap:10px; flex:1; min-width:240px; justify-content:center}
.rank{background:var(--grape); padding:3px 12px; border-radius:999px; font-family:'Fredoka'; font-size:.9rem; white-space:nowrap}
.xpwrap{flex:1; max-width:260px; height:16px; background:rgba(255,255,255,.18); border-radius:99px; overflow:hidden; position:relative}
.xpfill{height:100%; width:0; background:linear-gradient(90deg,var(--mint),var(--banana)); transition:width .6s cubic-bezier(.3,1.4,.6,1)}
.xptext{font-family:'Fredoka'; font-size:.9rem; white-space:nowrap}
.bananas{font-family:'Fredoka'; font-size:1rem; background:rgba(255,210,63,.18); padding:3px 10px; border-radius:99px; white-space:nowrap}
.tools{display:flex; gap:8px}
.iconbtn{background:rgba(255,255,255,.12); color:#fff; border:2px solid rgba(255,255,255,.25); border-radius:12px; padding:6px 12px; font-size:.95rem}
.iconbtn:hover{background:rgba(255,255,255,.22)}
.iconbtn.stop{background:var(--coral); border-color:var(--coral); display:none}
.iconbtn.stop.show{display:inline-block}

/* settings */
.settings{position:fixed; top:64px; right:16px; z-index:30; background:var(--card); color:var(--ink); border-radius:var(--r);
  box-shadow:var(--shadow); padding:18px; width:min(340px, calc(100vw - 32px)); display:none; border:3px solid var(--sky)}
.settings.open{display:block}
.settings h3{font-size:1.2rem}
.settings label{display:block; margin:.6em 0 .2em; font-weight:600; font-size:.95rem}
.seg{display:flex; gap:6px}
.seg button{flex:1; border:2px solid #cfd8d4; background:#f4f7f6; border-radius:10px; padding:6px; font-size:.95rem}
.seg button.on{background:var(--sky); border-color:#2aa7cf; color:#05303e; font-weight:600}
.settings input[type=range]{width:100%}
.check-row{display:flex; align-items:center; gap:8px; margin-top:.6em; font-size:.95rem}
.check-row input{width:22px; height:22px}
.voice-note{font-size:.8rem; color:var(--muted); margin-top:.6em}

/* ---------- map ---------- */
.map{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding:14px 16px 4px; max-width:1200px; margin:0 auto}
.stop-pill{display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-family:'Fredoka'; font-size:.9rem;
  background:rgba(255,255,255,.1); color:rgba(255,255,255,.55); border:2px dashed rgba(255,255,255,.25)}
.stop-pill.current{background:var(--banana); color:#3b2a00; border:2px solid #fff; transform:scale(1.06)}
.stop-pill.done{background:var(--mint); color:#033; border:2px solid var(--mint)}
.stop-pill.done, .stop-pill.current{cursor:pointer}
.map .arrow{color:rgba(255,255,255,.4); align-self:center}

main{max-width:1200px; margin:0 auto; padding:12px 16px 40px}
.panel{background:var(--cream); border-radius:24px; box-shadow:var(--shadow); padding:24px; position:relative}

/* ---------- mascot ---------- */
.coach{display:flex; gap:14px; align-items:flex-start; margin-bottom:18px}
.coach .face{font-size:3.2rem; line-height:1; filter:drop-shadow(0 3px 0 rgba(0,0,0,.15)); animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.bubble{background:#fff; border:3px solid var(--leaf); border-radius:18px; padding:12px 16px; position:relative; flex:1}
.bubble:before{content:""; position:absolute; left:-14px; top:18px; border:8px solid transparent; border-right:12px solid var(--leaf)}
.bubble b{color:var(--jungle2)}

.btn{border:none; border-radius:14px; padding:12px 22px; font-family:'Fredoka'; font-weight:600; font-size:1.1rem;
  background:var(--orange); color:#fff; box-shadow:0 5px 0 #c46f00; transition:transform .08s}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 #c46f00}
.btn:disabled{background:#b9c3bf; box-shadow:0 5px 0 #8f9b96; cursor:not-allowed}
.btn.green{background:var(--good); box-shadow:0 5px 0 #08693a}
.btn.blue{background:#1f8fbf; box-shadow:0 5px 0 #11607f}
.btn.ghost{background:#fff; color:var(--jungle2); border:2px solid var(--jungle2); box-shadow:0 5px 0 #c9d6d0}
.say{border:2px solid var(--sky); background:#e8f8fd; color:#0b5570; border-radius:12px; padding:6px 12px; font-size:.9rem; font-weight:600}
.say:hover{background:#d3f1fb}
.say.playing{background:var(--sky); color:#fff}

/* home */
.hero{text-align:center; padding:10px 0 4px}
.hero h1{font-size:clamp(2rem,5vw,3.2rem); color:var(--jungle2)}
.hero .big{font-size:4.5rem; animation:bob 2.4s ease-in-out infinite; display:inline-block}
.std-tag{display:inline-block; background:var(--jungle2); color:#fff; border-radius:8px; padding:2px 10px; font-size:.8rem; font-weight:600; margin-bottom:8px}
.mission-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:18px 0}
.mcard{border-radius:16px; padding:14px; color:#fff; font-family:'Fredoka'; box-shadow:0 4px 0 rgba(0,0,0,.15)}
.mcard .ic{font-size:1.8rem}
.mcard small{display:block; font-family:'Lexend'; opacity:.95; font-size:.85rem}
.namebox{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; align-items:center; margin:16px 0}
.namebox input{font-family:inherit; font-size:1.1rem; padding:10px 14px; border-radius:12px; border:3px solid var(--leaf); min-width:240px}

/* lesson */
.slide{min-height:330px}
.slide h2{font-size:1.8rem; color:var(--jungle2)}
.pie{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-top:12px}
.pie div{border-radius:18px; padding:16px; color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.18)}
.pie .p{background:var(--coral)} .pie .i{background:#1f8fbf} .pie .e{background:var(--grape)}
.pie h3{font-size:1.5rem; margin:0}
.pie .key{display:inline-block; background:rgba(255,255,255,.25); border-radius:8px; padding:0 8px; font-family:'Fredoka'; margin:4px 0}
.clues{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px}
.clues ul{margin:.3em 0 0; padding-left:1.1em}
.clues > div{background:#fff; border-radius:16px; padding:14px; border-top:8px solid}
.reveal-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:10px}
.rcard{background:#fff; border:3px solid #d8e3de; border-radius:16px; padding:14px; text-align:left; position:relative; transition:transform .2s}
.rcard:hover{transform:translateY(-3px)}
.rcard .tag{display:block; margin-top:10px; padding:8px 10px; border-radius:10px; background:#eef2f0; color:var(--muted); font-family:'Fredoka'; text-align:center}
.rcard.shown .tag{color:#fff}
.rcard.shown.inf .tag{background:#1f8fbf} .rcard.shown.per .tag{background:var(--coral)} .rcard.shown.ent .tag{background:var(--grape)}
.compare{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px}
.compare > div{background:#fff; border-radius:16px; padding:14px; border-left:8px solid}
.steps{counter-reset:s; list-style:none; padding:0; margin:12px 0 0}
.steps li{counter-increment:s; background:#fff; border-radius:14px; padding:12px 14px 12px 58px; margin-bottom:10px; position:relative}
.steps li:before{content:counter(s); position:absolute; left:12px; top:10px; width:34px; height:34px; border-radius:50%;
  background:var(--banana); font-family:'Fredoka'; font-weight:700; display:grid; place-items:center; color:#3b2a00}
.slidenav{display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; flex-wrap:wrap}
.dots{display:flex; gap:6px}
.dots span{width:12px; height:12px; border-radius:50%; background:#cfd8d4}
.dots span.on{background:var(--orange); transform:scale(1.3)}
.hl{background:linear-gradient(transparent 55%, rgba(255,210,63,.7) 55%); padding:0 2px}

/* ---------- split test layout ---------- */
.split{display:grid; grid-template-columns:1.05fr 1fr; gap:16px; align-items:start}
.ppane{background:#fff; border-radius:20px; box-shadow:var(--shadow); overflow:hidden; position:sticky; top:84px; max-height:calc(100vh - 100px); display:flex; flex-direction:column}
.tabs{display:flex; background:#e9efec}
.tabs button{flex:1; border:none; background:transparent; padding:12px 8px; font-family:'Fredoka'; font-size:1rem; color:var(--muted); border-bottom:4px solid transparent}
.tabs button.on{background:#fff; color:var(--jungle2); border-bottom-color:var(--orange)}
.pbody{padding:18px 20px; overflow:auto}
.ptitle{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px}
.ptitle h3{font-size:1.4rem; color:var(--jungle2); margin:0}
.byline{font-size:.85rem; color:var(--muted); margin:0 0 10px; font-style:italic}
.para{display:flex; gap:10px; margin:0 0 12px; border-radius:10px; padding:4px 6px; transition:background .3s}
.para .pn{flex:none; width:30px; height:30px; border-radius:50%; border:2px solid var(--sky); background:#e8f8fd; color:#0b5570;
  font-family:'Fredoka'; font-size:.9rem; padding:0; margin-top:2px}
.para .pn:hover{background:var(--sky); color:#fff}
.para.flash{background:var(--hint); box-shadow:0 0 0 3px var(--banana)}
.s{border-radius:6px; transition:background .2s}
.reading{background:rgba(76,201,240,.35)!important; box-shadow:0 0 0 2px rgba(76,201,240,.35)}
.vocab{border:none; background:none; padding:0; color:#7a3fd1; font-weight:600; text-decoration:underline dotted 2px; text-underline-offset:3px}
.vtip{position:absolute; z-index:40; background:#2b1650; color:#fff; padding:10px 14px; border-radius:12px; max-width:280px; font-size:.95rem; box-shadow:var(--shadow)}
.vtip b{color:var(--banana)}
.acct{background:#f6faf8; border:2px solid #d8e3de; border-radius:14px; padding:12px 14px; margin-bottom:12px}
.acct h4{margin:0 0 4px; font-family:'Fredoka'; color:var(--jungle2); font-size:1.1rem; display:flex; justify-content:space-between; align-items:center}
.event{background:var(--banana); border-radius:12px; padding:8px 12px; font-family:'Fredoka'; margin-bottom:12px; color:#3b2a00}

/* ---------- question card ---------- */
.qtop{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.qdots{display:flex; gap:5px; flex-wrap:wrap}
.qdots span{width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.2); display:grid; place-items:center; font-size:.75rem; font-family:'Fredoka'; color:#fff}
.qdots span.cur{background:var(--banana); color:#3b2a00}
.qdots span.ok{background:var(--mint); color:#033}
.qdots span.ok2{background:var(--sky); color:#033}
.qdots span.miss{background:var(--coral)}
.qcard{background:var(--cream); border-radius:22px; box-shadow:var(--shadow); padding:20px; animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96); opacity:0}}
.qhead{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap}
.qnum{background:var(--jungle2); color:#fff; font-family:'Fredoka'; padding:4px 12px; border-radius:999px; font-size:.95rem}
.tries{font-size:.85rem; color:var(--muted); font-weight:600}
.stem{font-weight:500; margin-bottom:12px}
.stem .quote{display:block; margin-top:8px; background:#fff; border-left:6px solid var(--grape); padding:10px 14px; border-radius:10px; font-style:italic}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; background:#fff; border:3px solid #d8e3de; border-radius:16px; padding:12px 14px;
  color:var(--ink); line-height:1.45; transition:transform .1s, border-color .15s}
.opt:hover:not(:disabled){border-color:var(--sky); transform:translateX(3px)}
.opt .let{flex:none; width:32px; height:32px; border-radius:50%; background:#eef2f0; font-family:'Fredoka'; font-weight:600; display:grid; place-items:center}
.opt.sel{border-color:var(--orange); background:#fff6e8}
.opt.sel .let{background:var(--orange); color:#fff}
.opt.right{border-color:var(--good); background:var(--goodbg)}
.opt.right .let{background:var(--good); color:#fff}
.opt.wrong{border-color:var(--bad); background:var(--badbg); opacity:.75}
.opt.wrong .let{background:var(--bad); color:#fff}
.opt:disabled{cursor:default}
.opt.quotey .otext:before{content:"\201C"} .opt.quotey .otext:after{content:"\201D"}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pickn{font-size:.85rem; font-weight:600; color:var(--grape); margin:-4px 0 10px}

.mtable{width:100%; border-collapse:separate; border-spacing:0 8px}
.mtable th{font-family:'Fredoka'; font-weight:600; font-size:.95rem; color:var(--jungle2); text-align:center; padding:0 4px}
.mtable th:first-child{text-align:left}
.mtable td{background:#fff; padding:10px; vertical-align:middle}
.mtable td:first-child{border-radius:14px 0 0 14px; font-size:.95rem}
.mtable td:last-child{border-radius:0 14px 14px 0}
.mtable tr.rok td{background:var(--goodbg)}
.mtable tr.rbad td{background:var(--badbg)}
.cellbtn{width:44px; height:44px; border-radius:12px; border:3px solid #cfd8d4; background:#f4f7f6; display:block; margin:0 auto; font-size:1.1rem}
.cellbtn.sel{background:var(--orange); border-color:#c46f00; color:#fff}
.cellbtn.right{background:var(--good); border-color:#08693a; color:#fff}
.cellbtn.x{opacity:.35}
.cellbtn:disabled{cursor:default}

.fb{margin-top:14px}
.fbbox{border-radius:16px; padding:12px 16px; display:flex; gap:12px; align-items:flex-start; animation:pop .3s ease}
.fbbox .em{font-size:2rem; line-height:1}
.fbbox.good{background:var(--goodbg); border:3px solid var(--good)}
.fbbox.hint{background:var(--hint); border:3px solid var(--banana)}
.fbbox.reveal{background:#eaf3ff; border:3px solid #1f8fbf}
.fbbox h4{margin:0 0 2px; font-family:'Fredoka'; font-size:1.15rem}
.fbbox p{margin:0}
.qfoot{display:flex; justify-content:flex-end; gap:10px; margin-top:16px; flex-wrap:wrap}

.float{position:fixed; z-index:50; font-family:'Fredoka'; font-weight:700; font-size:1.6rem; color:var(--banana);
  text-shadow:0 2px 0 #7a5a00, 0 0 12px rgba(0,0,0,.4); pointer-events:none; animation:floatup 1.2s ease-out forwards}
@keyframes floatup{to{transform:translateY(-80px) scale(1.3); opacity:0}}
#toast{position:fixed; left:50%; top:90px; transform:translateX(-50%) translateY(-200px); z-index:60; background:var(--grape); color:#fff;
  padding:14px 24px; border-radius:18px; font-family:'Fredoka'; font-size:1.3rem; box-shadow:var(--shadow); transition:transform .5s cubic-bezier(.3,1.5,.6,1); text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:55}

/* results */
.trophy{font-size:5rem; text-align:center; animation:bob 2s infinite}
.scoregrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:16px 0}
.scoregrid div{background:#fff; border-radius:16px; padding:14px; text-align:center; border-bottom:6px solid var(--leaf)}
.scoregrid b{display:block; font-family:'Fredoka'; font-size:2rem; color:var(--jungle2)}
.badges{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:10px 0}
.badge{background:#fff; border-radius:16px; padding:10px 14px; text-align:center; width:160px; border:3px solid var(--banana)}
.badge.off{opacity:.35; filter:grayscale(1); border-color:#ccc}
.badge .ic{font-size:2.2rem}
.badge b{display:block; font-family:'Fredoka'; font-size:.95rem}
.badge small{font-size:.75rem; color:var(--muted)}
.review{background:#fff; border-radius:16px; padding:14px 18px; margin-top:10px}
.review li{margin-bottom:8px}
.center{text-align:center}
footer{text-align:center; color:rgba(255,255,255,.65); font-size:.8rem; padding:0 16px 24px}


.lvl{background:var(--banana); color:#3b2a00; border-radius:8px; padding:1px 8px; font-size:.8rem; margin-left:4px; vertical-align:middle}
.iconbtn.on{background:var(--banana); color:#3b2a00; border-color:var(--banana)}
.pad{background:#fff; border:3px solid var(--sky); border-radius:16px; overflow:hidden; margin:10px 0}
.padbar{display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px; background:#e8f8fd; border-bottom:2px solid #bfe9f7}
.pc{width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px #cfd8d4; padding:0}
.pc.on{box-shadow:0 0 0 3px var(--orange)}
.ptool{border:2px solid #bfe9f7; background:#fff; border-radius:10px; padding:4px 10px; font-size:.85rem; color:#0b5570; font-weight:600}
.ptool.on{background:var(--sky); color:#fff}
.padarea{position:relative; background:#fff repeating-linear-gradient(transparent 0 35px, #cfe3f5 35px 36px)}
.padarea canvas{display:block; touch-action:none; cursor:crosshair}
.padtext{width:100%; border:none; border-top:2px dashed #bfe9f7; padding:10px 12px; font-family:inherit; font-size:1rem; min-height:90px; resize:vertical; display:block}
.pad.locked .padbar{opacity:.4; pointer-events:none}
.pad.locked canvas{pointer-events:none}
.frame{background:#f3ecff; border-left:6px solid var(--grape); border-radius:10px; padding:8px 12px; margin-bottom:6px}
.checklist{background:#fff; border-radius:14px; padding:10px 14px; margin-top:6px}
.cl-title{font-weight:600; font-size:.95rem; margin-bottom:4px}
.cl{display:flex; gap:10px; align-items:center; padding:4px 0; font-size:.95rem; cursor:pointer}
.cl input{width:24px; height:24px; accent-color:var(--good); flex:none}
.tryit{background:#fff; border-radius:16px; padding:12px 14px; margin-top:12px; border:3px dashed var(--grape)}
#drawLayer{position:absolute; left:0; top:0; z-index:45; pointer-events:none; touch-action:none}
#drawLayer.on{pointer-events:auto; cursor:crosshair}
.drawbar{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:47; background:#2b1650; color:#fff; border-radius:18px; padding:8px 12px;
  display:none; gap:8px; align-items:center; box-shadow:var(--shadow); flex-wrap:wrap; justify-content:center; max-width:calc(100vw - 24px)}
.drawbar.show{display:flex}
.drawbar .pc{box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.drawbar .pc.on{box-shadow:0 0 0 3px var(--banana)}
.drawbar .ptool{background:rgba(255,255,255,.12); color:#fff; border-color:rgba(255,255,255,.3)}
.drawbar .ptool.on{background:var(--banana); color:#3b2a00}
.drawbar small{font-size:.75rem; opacity:.85; width:100%; text-align:center}
.wresp{background:#fff; border-radius:14px; padding:12px; margin-top:10px; border:2px solid #d8e3de}
.wresp img{max-width:100%; border:1px solid #e3e9e6; border-radius:8px; display:block; margin-top:6px}
.wresp .typed{white-space:pre-wrap; background:#f6faf8; border-radius:8px; padding:8px; margin-top:6px}
.sample{margin-top:8px; background:#fff; border-radius:10px; padding:8px 10px; font-style:italic}

@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .ppane{position:relative; top:0; max-height:52vh}
  .compare{grid-template-columns:1fr}
}
@media (max-width:600px){
  body{font-size:17px}
  .panel{padding:16px}

<script>
/* ============================================================
   HELPERS
============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const vocab = s => s.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, (m, w, d) => `<button class="vocab" data-word="${esc(w)}" data-def="${esc(d)}">${w}</button>`);
const plain = s => s.replace(/\[\[([^|\]]+)\|[^\]]+\]\]/g, '$1').replace(/<[^>]+>/g, '');
const noEmoji = s => s.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g,' ').trim();
const LET = ['A','B','C','D','E'];
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem('ppq_'+k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem('ppq_'+k, JSON.stringify(v)); } catch(e){} }
};

/* ============================================================
   READ-ALOUD (US English voices only)
============================================================ */
const TTS = {
  ok: 'speechSynthesis' in window, voices: [], mode: 'female', rate: 0.85, auto: true, token: 0, btn: null,
  F: /google us english|samantha|aria|jenny|ava|allison|susan|zira|michelle|female|nicky|joanna|salli|kendra|kimberly|ivy|emma|nora|ana\b|sara|elizabeth|libby|amber|ashley|cora|monica|nancy/i,
  M: /\bmale|alex|aaron|fred|guy|davis|andrew|christopher|eric|tom\b|evan|nathan|matthew|joey|justin|brian|roger|steffan|tony|jason|ryan|daniel|brandon|jacob|kevin|ralph|junior|rocko|reed|eddy/i,
  load(){
    if(!this.ok) return;
    this.voices = speechSynthesis.getVoices().filter(v => /^en[-_]us/i.test(v.lang));
  },
  pick(g){
    const L = this.voices;
    if(!L.length) return null;
    if(g === 'female') return L.find(v => /google us english/i.test(v.name)) || L.find(v => this.F.test(v.name)) || L[0];
    return L.find(v => this.M.test(v.name) && !/female/i.test(v.name) && !this.F.test(v.name)) || L.find(v => !this.F.test(v.name)) || L[0];
  },
  segsFrom(root){
    const out = [];
    const els = root.matches && root.matches('[data-read]') ? [root] : $$('[data-read]', root);
    els.forEach(el => {
      if(el.offsetParent === null && el.getClientRects().length === 0) return;
      const ss = $$('.s', el);
      if(ss.length) ss.forEach(s => out.push({ el: s, text: s.dataset.say || s.innerText }));
      else out.push({ el, text: el.dataset.say || el.innerText });
    });
    return out.map(o => ({ el: o.el, text: noEmoji(o.text) })).filter(o => o.text);
  },
  clearHL(){ $$('.reading').forEach(e => e.classList.remove('reading')); },
  stop(){
    this.token++;
    if(this.ok) speechSynthesis.cancel();
    this.clearHL();
    if(this.btn){ this.btn.classList.remove('playing'); this.btn.textContent = this.btn.dataset.label || '🔊 Read to me'; }
    this.btn = null;
    $('#stopBtn').classList.remove('show');
  },
  speak(segs, kind = 'lesson', btn = null){
    this.stop();
    if(!this.ok || !segs.length) return;
    if(!this.voices.length) this.load();
    const my = ++this.token;
    const g = this.mode === 'mixed' ? (kind === 'q' ? 'male' : 'female') : this.mode;
    const voice = this.pick(g);
    if(btn){ this.btn = btn; btn.dataset.label = btn.dataset.label || btn.textContent; btn.classList.add('playing'); btn.textContent = '⏸ Stop'; }
    $('#stopBtn').classList.add('show');
    let i = 0;
    const next = () => {
      if(my !== this.token) return;
      this.clearHL();
      if(i >= segs.length){ this.stop(); return; }
      const s = segs[i++];
      if(s.el){ s.el.classList.add('reading'); }
      const u = new SpeechSynthesisUtterance(s.text);
      if(voice){ u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
      u.rate = this.rate;
      u.onend = () => setTimeout(next, 140);
      u.onerror = () => setTimeout(next, 140);
      speechSynthesis.resume();
      speechSynthesis.speak(u);
    };
    next();
  },
  read(root, kind, btn){
    if(btn && btn.classList.contains('playing')){ this.stop(); return; }
    this.speak(this.segsFrom(root), kind, btn);
  },
  sayText(t, kind = 'q'){ this.speak([{ el: null, text: noEmoji(t) }], kind); }
};
if(TTS.ok){ TTS.load(); speechSynthesis.onvoiceschanged = () => TTS.load(); }

/* ============================================================

============================================================ */
const SFX = {
  on: true, ctx: null,
  tone(f, d, type = 'sine', when = 0, vol = .15){
    if(!this.on) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d);
    } catch(e){}
  },
  click(){ this.tone(660, .06, 'square', 0, .05); },
  good(){ [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .18, 'triangle', i * .09)); },
  oops(){ this.tone(330, .18, 'sawtooth', 0, .07); this.tone(247, .28, 'sawtooth', .16, .07); },
  level(){ [392, 523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, .22, 'triangle', i * .08, .12)); }
};

function rankFor(xp){ let r = RANKS[0][1]; RANKS.forEach(([n, t]) => { if(xp >= n) r = t; }); return r; }
function updateHUD(){

}
function addXP(pts, fromEl){
  const before = rankFor(S.xp);

    const r = fromEl.getBoundingClientRect();

function toast(html){ const t = $('#toast'); t.innerHTML = html; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600); }

/* confetti */
const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], raf = null;
function sizeCv(){ cv.width = innerWidth; cv.height = innerHeight; } sizeCv(); addEventListener('resize', sizeCv);
function burst(n = 120){
  const cols = ['#ffd23f','#ff6b6b','#4cc9f0','#9b5de5','#06d6a0','#ff9f1c'];
  for(let i = 0; i < n; i++) parts.push({ x: innerWidth/2 + (Math.random()-.5)*200, y: innerHeight/3, vx: (Math.random()-.5)*14, vy: Math.random()*-12-4,
    s: Math.random()*8+5, c: cols[i % cols.length], r: Math.random()*6, vr: (Math.random()-.5)*.3, life: 160 });
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); cx.restore(); });
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,cv.width,cv.height), null);
}

function go(i){

/* ============================================================

============================================================ */
function renderQ(q, host, onDone, ctx = {}){
  if(q.type === 'write') return renderWrite(q, host, onDone, ctx);
  host.innerHTML = '';
  let tries = 0, finished = false;
  const card = h(`<div class="qcard">
    <div class="qhead"><span class="qnum">${q.label}</span><span class="tries" id="triesLbl">🎯 2 tries</span></div>
    <div class="stem" data-read>${q.stem}</div>
    ${q.type === 'multi' ? `<div class="pickn">Choose ${q.pick} answers.</div>` : ''}
    <div class="opts"></div>
    <div class="fb"></div>
    <div class="qfoot"><span class="sayq"></span><button class="btn check" disabled>Check Answer ✔</button></div>
  </div>`);
  host.append(card);
  const opts = $('.opts', card), fb = $('.fb', card), check = $('.check', card), triesLbl = $('#triesLbl', card);
  $('.sayq', card).append(sayBtn('🔊 Read question', () => card, 'q'));
  // only read stem + options (not feedback) for "Read question"
  $('.sayq .say', card).onclick = (e) => {
    e.stopPropagation();
    const b = e.currentTarget;
    if(b.classList.contains('playing')){ TTS.stop(); return; }
    const segs = TTS.segsFrom($('.stem', card)).concat(TTS.segsFrom(opts));
    TTS.speak(segs, 'q', b);
  };

  let sel = null, set = new Set(), rowSel = [], rowLocked = [];
  const optBtns = [];

  if(q.type === 'mc' || q.type === 'multi'){
    q.options.forEach((o, i) => {
      const b = h(`<button class="opt ${q.quotey ? 'quotey' : ''}" data-read data-say="${esc(LET[i] + '. ' + plain(o))}"><span class="let">${LET[i]}</span><span class="otext">${o}</span></button>`);
      b.onclick = () => {
        if(finished || b.disabled) return;
        SFX.click();
        if(q.type === 'mc'){ optBtns.forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = i; check.disabled = false; }
        else {
          if(set.has(i)){ set.delete(i); b.classList.remove('sel'); }
          else if(set.size < q.pick){ set.add(i); b.classList.add('sel'); }
          else { b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 400); }
          check.disabled = set.size !== q.pick;
        }
      };
      optBtns.push(b); opts.append(b);
    });
  } else if(q.type === 'match'){
    const tbl = h(`<table class="mtable"><thead><tr><th>Detail</th>${q.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody></tbody></table>`);
    q.rows.forEach((r, ri) => {
      rowSel[ri] = null; rowLocked[ri] = false;
      const tr = h(`<tr><td data-read>${r}</td>${q.cols.map((c, ci) => `<td><button class="cellbtn" data-c="${ci}" aria-label="${esc(q.colSay[ci])}"></button></td>`).join('')}</tr>`);
      $$('.cellbtn', tr).forEach(cb => cb.onclick = () => {
        if(finished || rowLocked[ri] || cb.disabled) return;
        SFX.click();
        $$('.cellbtn', tr).forEach(x => { x.classList.remove('sel'); x.textContent = ''; });
        cb.classList.add('sel'); cb.textContent = '✔'; rowSel[ri] = +cb.dataset.c;
        check.disabled = rowSel.some(v => v === null);
      });
      $('tbody', tbl).append(tr);
    });
    opts.append(tbl);
  }

  const feedback = (kind, title, text, emoji) => {
    fb.innerHTML = '';
    const box = h(`<div class="fbbox ${kind}"><div class="em">${emoji}</div><div><h4 data-read>${title}</h4><p data-read>${text}</p></div></div>`);
    const sb = sayBtn('🔊', () => box, 'q'); sb.style.marginLeft = 'auto'; sb.style.flex = 'none';
    box.append(sb);
    fb.append(box);
    if(TTS.auto) setTimeout(() => TTS.read(box, 'q'), 200);
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  const finish = (correct) => {
    finished = true;
    const pts = correct ? (tries === 0 ? 10 : 5) : 0;
    addXP(pts, check);
    check.remove();
    const nx = h(`<button class="btn green">${ctx.last ? 'Finish ➜' : 'Next Question ➜'}</button>`);
    nx.onclick = () => { SFX.click(); TTS.stop(); ctx.clearFlash && ctx.clearFlash(); onDone({ id: q.id, label: q.label, skill: q.skill, correct, firstTry: correct && tries === 0, pts }); };
    $('.qfoot', card).append(nx);
    triesLbl.textContent = correct ? (tries === 0 ? '⭐ First try!' : '💪 Second try!') : '📖 Review it';
  };

  const grade = () => {
    if(q.type === 'mc') return sel === q.answer;
    if(q.type === 'multi') return set.size === q.answers.length && q.answers.every(a => set.has(a));
    if(q.type === 'match') return rowSel.every((v, i) => v === q.answers[i]);
  };

  check.onclick = () => {
    if(finished) return;
    TTS.stop();
    const ok = grade();
    if(ok){
      SFX.good(); burst(40);
      if(q.type === 'mc') optBtns[sel].classList.replace('sel', 'right');
      if(q.type === 'multi') set.forEach(i => optBtns[i].classList.replace('sel', 'right'));
      if(q.type === 'match') $$('tbody tr', opts).forEach((tr, ri) => { tr.classList.add('rok'); $$('.cellbtn', tr)[q.answers[ri]].className = 'cellbtn right'; });
      const cheers = ['Awesome!', 'You got it!', 'Super scientist!', 'Banana-tastic!', 'Nailed it!', 'Jane would be proud!'];
      feedback('good', (tries === 0 ? '⭐ ' : '💪 ') + cheers[Math.floor(Math.random() * cheers.length)], q.explain, '🎉');
      finish(true);
      return;
    }
    SFX.oops();
    card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 400);
    if(tries === 0){
      tries = 1; triesLbl.textContent = '🎯 1 try left';
      let extra = '';
      if(q.type === 'mc'){ optBtns[sel].classList.replace('sel', 'wrong'); optBtns[sel].disabled = true; sel = null; }
      if(q.type === 'multi'){
        let keep = 0;
        [...set].forEach(i => { if(!q.answers.includes(i)){ optBtns[i].classList.replace('sel', 'wrong'); optBtns[i].disabled = true; set.delete(i); } else keep++; });
        extra = keep === 1 ? ' Good news: ONE of your choices is right, so keep it! Change the other one.' : ' Neither choice was right. Try two new ones.';
      }
      if(q.type === 'match'){
        let right = 0;
        $$('tbody tr', opts).forEach((tr, ri) => {
          if(rowSel[ri] === q.answers[ri]){ tr.classList.add('rok'); rowLocked[ri] = true; $$('.cellbtn', tr)[rowSel[ri]].className = 'cellbtn right'; right++; }
          else { const wb = $$('.cellbtn', tr)[rowSel[ri]]; wb.classList.remove('sel'); wb.textContent = '✖'; wb.classList.add('x'); wb.disabled = true; rowSel[ri] = null; }
        });
        extra = ` You got ${right} out of ${q.rows.length} right. Fix the rows that are not green.`;
      }
      check.disabled = true;
      if(ctx.flash && q.para) ctx.flash(q.para);
      feedback('hint', 'Not quite. Here is a hint!', q.hint + extra + ' You have one more try.', '🤔');
      return;
    }
    // second miss: show correct answer
    if(q.type === 'mc'){ optBtns[sel].classList.replace('sel', 'wrong'); optBtns[q.answer].classList.add('right'); }
    if(q.type === 'multi'){ set.forEach(i => { if(!q.answers.includes(i)) optBtns[i].classList.replace('sel', 'wrong'); }); q.answers.forEach(i => { optBtns[i].classList.remove('sel'); optBtns[i].classList.add('right'); }); }
    if(q.type === 'match'){
      $$('tbody tr', opts).forEach((tr, ri) => {
        const bs = $$('.cellbtn', tr); bs.forEach(x => { x.classList.remove('sel'); if(!x.classList.contains('x')) x.textContent = ''; });
        bs[q.answers[ri]].className = 'cellbtn right'; bs[q.answers[ri]].textContent = '✔';
        if(!tr.classList.contains('rok')) tr.classList.add('rbad');
      });
    }
    optBtns.forEach(b => b.disabled = true);
    feedback('reveal', 'Good effort! Let\'s learn from this one.', 'The correct answer is now shown in green. ' + q.explain, '📘');
    finish(false);
  };

  autoRead(card, 'q');
}

/* ============================================================
   WRITING PAD (Apple Pencil / finger / mouse + typing)
============================================================ */
function makePad(id, opts = {}){
  const H = opts.height || 220, COLORS = ['#1d2b26', '#1f6fd1', '#d64545', '#0f9d58'];
  const el = h(`<div class="pad">
    <div class="padbar">${COLORS.map((c, i) => `<button class="pc ${i ? '' : 'on'}" data-c="${c}" style="background:${c}" aria-label="pen color"></button>`).join('')}
      <button class="ptool" data-t="eraser">🧽 Eraser</button><button class="ptool" data-t="undo">↩ Undo</button>
      <button class="ptool" data-t="clear">🗑 Clear</button><button class="ptool" data-t="type">⌨️ Type</button></div>
    <div class="padarea"><canvas></canvas></div>
    <textarea class="padtext" placeholder="Type your answer here..." style="display:none"></textarea></div>`);
  const cv = $('canvas', el), area = $('.padarea', el), ta = $('textarea', el), ctx = cv.getContext('2d');
  const saved = store.get('pad_' + id) || {};
  let strokes = saved.s || [], cur = null, color = COLORS[0], eraser = false, penSeen = false, W = 300;
  if(saved.t){ ta.value = saved.t; ta.style.display = 'block'; }
  const api = { el, onChange: () => {} };
  const save = () => { store.set('pad_' + id, { s: strokes, t: ta.value }); api.onChange(); };
  const drawStroke = st => {
    if(st.p.length < 1) return;
    ctx.globalCompositeOperation = st.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = st.c; ctx.fillStyle = st.c; ctx.lineWidth = st.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(st.p[0][0] * W, st.p[0][1]);
    if(st.p.length === 1) ctx.lineTo(st.p[0][0] * W + .1, st.p[0][1]);
    st.p.forEach(pt => ctx.lineTo(pt[0] * W, pt[1])); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  };
  const redraw = () => { ctx.clearRect(0, 0, W, H); strokes.forEach(drawStroke); if(cur) drawStroke(cur); };
  const fit = () => {
    W = area.clientWidth || 300; const d = devicePixelRatio || 1;
    cv.width = W * d; cv.height = H * d; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(d, 0, 0, d, 0, 0); redraw();
  };
  if('ResizeObserver' in window) new ResizeObserver(fit).observe(area); else setTimeout(fit, 50);
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / W, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => {
    if(e.pointerType === 'pen') penSeen = true;
    if(e.pointerType === 'touch' && penSeen) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    cur = { c: color, e: eraser, w: eraser ? 22 : 3.5, p: [pos(e)] }; redraw();
  });
  cv.addEventListener('pointermove', e => { if(!cur) return; e.preventDefault(); cur.p.push(pos(e)); redraw(); });
  const end = () => { if(!cur) return; strokes.push(cur); cur = null; redraw(); save(); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
  $$('.pc', el).forEach(b => b.onclick = () => { $$('.pc', el).forEach(x => x.classList.remove('on')); b.classList.add('on'); color = b.dataset.c; eraser = false; $('[data-t=eraser]', el).classList.remove('on'); });
  $('[data-t=eraser]', el).onclick = e => { eraser = !eraser; e.currentTarget.classList.toggle('on', eraser); };
  $('[data-t=undo]', el).onclick = () => { strokes.pop(); redraw(); save(); };
  $('[data-t=clear]', el).onclick = () => { strokes = []; redraw(); save(); };
  $('[data-t=type]', el).onclick = () => { ta.style.display = ta.style.display === 'none' ? 'block' : 'none'; if(ta.style.display === 'block') ta.focus(); };
  ta.addEventListener('input', save);
  api.hasContent = () => strokes.some(s => !s.e) || ta.value.trim().length > 0;
  api.text = () => ta.value.trim();
  api.image = () => {
    if(!strokes.some(s => !s.e)) return null;
    const o = document.createElement('canvas'); o.width = cv.width; o.height = cv.height;
    const c = o.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, o.width, o.height); c.drawImage(cv, 0, 0);
    return o.toDataURL('image/png');
  };
  api.lock = () => { el.classList.add('locked'); ta.readOnly = true; };
  return api;
}
function clearPads(ids){ ids.forEach(id => store.set('pad_' + id, null)); }

function renderWrite(q, host, onDone, ctx = {}){
  host.innerHTML = '';

    <div class="qhead"><span class="qnum">${q.label}</span><span class="tries">✍️ Write your answer</span></div>

    ${q.frame ? `<div class="frame" data-read data-say="Sentence starter. ${esc(q.frame.replace(/_+/g, ' blank '))}"><b>Sentence starter:</b> ${q.frame}</div>` : ''}
    <div class="padslot"></div>
    <div class="checklist"><div class="cl-title" data-read>Check your work. Tap each box when it is true.</div>
      ${q.checklist.map((c, i) => `<label class="cl"><input type="checkbox" data-i="${i}"><span data-read>${c}</span></label>`).join('')}</div>
    <div class="fb"></div>
    <div class="qfoot"><span class="sayq"></span><button class="btn check" disabled>I'm Done ✔</button></div></div>`);
  host.append(card);
  const pad = makePad(q.id, { height: q.height || 250 });

  pad.onChange = () => { check.disabled = !pad.hasContent(); };
  pad.onChange();
  $('.sayq', card).append(sayBtn('🔊 Read question', () => card, 'q'));
  $('.sayq .say', card).onclick = e => {
    e.stopPropagation(); const b = e.currentTarget;
    if(b.classList.contains('playing')){ TTS.stop(); return; }
    TTS.speak(TTS.segsFrom($('.stem', card)).concat(q.frame ? TTS.segsFrom($('.frame', card)) : []), 'q', b);
  };
  $$('.cl input', card).forEach(c => c.onchange = () => SFX.click());
  check.onclick = () => {
    TTS.stop();
    const n = $$('.cl input', card).filter(c => c.checked).length, full = n === q.checklist.length;
    const pts = full ? 10 : 5;
    SFX.good(); burst(50); addXP(pts, check);
    pad.lock(); $$('.cl input', card).forEach(c => c.disabled = true);
    const fb = $('.fb', card);
    const box = h(`<div class="fbbox good"><div class="em">📝</div><div><h4 data-read>${full ? '⭐ Great writing!' : '💪 Nice work!'}</h4>
      <p data-read>${full ? 'You checked every box.' : 'Next time, try to do everything on the checklist.'} Compare your answer with this strong answer:</p>
      <div class="sample" data-read>${q.sample}</div></div></div>`);
    const sb = sayBtn('🔊', () => box, 'q'); sb.style.marginLeft = 'auto'; sb.style.flex = 'none'; box.append(sb);
    fb.append(box); if(TTS.auto) setTimeout(() => TTS.read(box, 'q'), 200);
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    check.remove();
    const nx = h(`<button class="btn green">${ctx.last ? 'Finish ➜' : 'Next Question ➜'}</button>`);
    nx.onclick = () => { SFX.click(); TTS.stop(); ctx.clearFlash && ctx.clearFlash();
      onDone({ id: q.id, label: q.label, skill: q.skill, correct: true, firstTry: full, pts, write: true, img: pad.image(), text: pad.text(), prompt: plain(q.stem) }); };
    $('.qfoot', card).append(nx);
  };
  autoRead(card, 'q');
}

/* ============================================================
   DRAW ON THE SCREEN (teacher + student annotation layer)
============================================================ */
const Draw = {
  on: false, strokes: [], cur: null, color: '#d64545', mode: 'pen', penSeen: false,
  init(){
    this.cv = h('<canvas id="drawLayer"></canvas>'); document.body.append(this.cv); this.ctx = this.cv.getContext('2d');
    const cols = [['#1d2b26','black'], ['#d64545','red'], ['#1f6fd1','blue'], ['#0f9d58','green']];
    this.bar = h(`<div class="drawbar">${cols.map(([c], i) => `<button class="pc ${i === 1 ? 'on' : ''}" data-c="${c}" style="background:${c}" aria-label="pen color"></button>`).join('')}
      <button class="ptool" data-m="hl">🖍 Highlight</button><button class="ptool" data-m="eraser">🧽 Erase</button>
      <button class="ptool" data-a="undo">↩ Undo</button><button class="ptool" data-a="clear">🗑 Clear</button><button class="ptool" data-a="done">✋ Done</button>
      <small>Pen is on. Tap ✋ Done to scroll and tap buttons again. Your marks stay until you clear them.</small></div>`);
    document.body.append(this.bar);
    $$('.pc', this.bar).forEach(b => b.onclick = () => { $$('.pc', this.bar).forEach(x => x.classList.remove('on')); b.classList.add('on'); this.color = b.dataset.c; this.setMode('pen'); });
    $$('[data-m]', this.bar).forEach(b => b.onclick = () => this.setMode(this.mode === b.dataset.m ? 'pen' : b.dataset.m));
    $('[data-a=undo]', this.bar).onclick = () => { this.strokes.pop(); this.redraw(); };
    $('[data-a=clear]', this.bar).onclick = () => this.clear();
    $('[data-a=done]', this.bar).onclick = () => this.off();
    const cv = this.cv;
    cv.addEventListener('pointerdown', e => {
      if(e.pointerType === 'pen') this.penSeen = true;
      if(e.pointerType === 'touch' && this.penSeen) return;
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      if(this.mode === 'eraser'){ this.erasing = true; this.eraseAt(e.pageX, e.pageY); return; }
      this.cur = { c: this.mode === 'hl' ? '#ffd23f' : this.color, hl: this.mode === 'hl', p: [[e.pageX, e.pageY]] }; this.redraw();
    });
    cv.addEventListener('pointermove', e => {
      if(this.erasing){ this.eraseAt(e.pageX, e.pageY); return; }
      if(!this.cur) return; e.preventDefault(); this.cur.p.push([e.pageX, e.pageY]); this.redraw();
    });
    const end = () => { this.erasing = false; if(this.cur){ this.strokes.push(this.cur); this.cur = null; this.redraw(); } };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    addEventListener('resize', () => { if(this.strokes.length || this.on) this.size(); });
    this.size();
  },
  setMode(m){ this.mode = m; $$('[data-m]', this.bar).forEach(b => b.classList.toggle('on', b.dataset.m === m)); },
  size(){
    const d = devicePixelRatio || 1, de = document.documentElement;
    this.cv.style.width = '0px'; this.cv.style.height = '0px';
    const W = de.scrollWidth, H = Math.max(de.scrollHeight, innerHeight);
    this.W = W; this.H = H; this.cv.width = W * d; this.cv.height = H * d;
    this.cv.style.width = W + 'px'; this.cv.style.height = H + 'px';
    this.ctx.setTransform(d, 0, 0, d, 0, 0); this.redraw();
  },
  stroke(st){
    const c = this.ctx; c.save(); c.globalAlpha = st.hl ? .4 : 1; c.strokeStyle = st.c; c.lineWidth = st.hl ? 22 : 4; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(st.p[0][0], st.p[0][1]); if(st.p.length === 1) c.lineTo(st.p[0][0] + .1, st.p[0][1]);
    st.p.forEach(p => c.lineTo(p[0], p[1])); c.stroke(); c.restore();
  },
  redraw(){ if(!this.ctx) return; this.ctx.clearRect(0, 0, this.W || 0, this.H || 0); this.strokes.forEach(s => this.stroke(s)); if(this.cur) this.stroke(this.cur); },
  eraseAt(x, y){ const n = this.strokes.length; this.strokes = this.strokes.filter(s => !s.p.some(p => Math.hypot(p[0] - x, p[1] - y) < 16)); if(this.strokes.length !== n) this.redraw(); },
  toggle(){ this.on ? this.off() : this.start(); },
  start(){ this.on = true; this.size(); this.cv.classList.add('on'); this.bar.classList.add('show'); $('#drawBtn').classList.add('on'); TTS.stop(); },
  off(){ if(!this.cv) return; this.on = false; this.cur = null; this.cv.classList.remove('on'); this.bar.classList.remove('show'); $('#drawBtn').classList.remove('on'); },
  clear(){ this.strokes = []; this.cur = null; this.redraw(); }
};

  const tabBar = $('.tabs', pane), body = $('.pbody', pane);
  tabs.forEach((t, i) => {
    const b = h(`<button role="tab">${t.name}</button>`);
    b.onclick = () => { SFX.click(); show(i); };
    tabBar.append(b);
    const sec = h(`<div class="ptab" style="display:none"></div>`);

}

  clearPads(EXP.filter(q => q.type === 'write').map(q => q.id));
  const app = $('#app');
  app.innerHTML = `<div class="split"><div id="paneHost"></div><div><div class="qtop"><div class="qdots" id="qd"></div><span style="color:#fff;font-family:Fredoka" id="qcount"></span></div><div id="qhost"></div></div></div>`;
  const pane = buildPane([{ name: '📄 Passage 1', node: passageNode(P1, 'p1') }, { name: '📄 Passage 2', node: passageNode(P2, 'p2') }]);
  $('#paneHost').append(pane);
  const F = flasher(pane);
  let i = 0;
  const step = () => {
    const q = EXP[i];
    if(q.tab !== undefined) pane.showTab(q.tab);
    $('#qd').innerHTML = dotsHTML(EXP, S.results.exp, i);
    $('#qcount').textContent = `${i + 1} of ${EXP.length}`;
    renderQ(q, $('#qhost'), r => {
      S.results.exp[i] = r; i++;
      if(i < EXP.length){ step(); if(innerWidth <= 900) $('#qhost').scrollIntoView({ behavior: 'smooth' }); }
      else go(5);
    }, { last: i === EXP.length - 1, flash: F.flash, clearFlash: F.clearFlash });
  };
  step();
}

/* ============================================================
   SCREEN: VICTORY
============================================================ */
function screenWin(){
  const R = S.results;
  const all = [...R.detective, ...R.same, ...R.exp];
  const cnt = a => a.filter(r => r.correct).length;
  const firsts = a => a.filter(r => r.firstTry).length;
  const comeback = all.some(r => r.correct && !r.firstTry);
  const badges = [
    { ic: '🐵', n: 'Campground Ranger', d: 'Every Campground Accounts item on the first try', on: R.detective.length === DETECTIVE.length && firsts(R.detective) === DETECTIVE.length },
    { ic: '🦧', n: 'Pip\'s Hero', d: 'Finished the Same Event Challenge', on: R.same.length === SAME.length },
    { ic: '🐒', n: 'Gombe Explorer', d: 'Finished the FAST-style expedition', on: R.exp.length === EXP.length },
    { ic: '✍️', n: 'Super Writer', d: 'Checked every box on a written answer', on: all.some(r => r.write && r.firstTry) },
    { ic: '💪', n: 'Never Give Up', d: 'Used a hint and got it right', on: comeback },
    { ic: '👑', n: 'Primate Master', d: 'Every expedition question correct', on: R.exp.length === EXP.length && cnt(R.exp) === EXP.length }
  ];
  const missed = all.filter(r => !r.correct);
  burst(200); SFX.level();
  $('#app').innerHTML = `<div class="panel">
    <div class="trophy">🏆</div>
    <h2 class="center" data-read style="font-size:2.2rem;color:var(--jungle2)">Mission Complete, ${esc(S.name || 'Explorer')}!</h2>
    <p class="center" data-read>Your rank: <b>${rankFor(S.xp)}</b>. You earned <b>${S.xp} XP</b> and <b>${S.bananas} bananas</b>!</p>
    <div class="scoregrid">
      <div><b>${cnt(R.detective)}/${DETECTIVE.length}</b>Campground Accounts</div>
      <div><b>${cnt(R.same)}/${R.same.length || SAME.length}</b>Same Event Challenge</div>
      <div style="border-color:var(--orange)"><b>${cnt(R.exp)}/${R.exp.length || EXP.length}</b>Gombe Expedition (FAST-style)</div>
      <div style="border-color:var(--grape)"><b>${firsts(all)}</b>Correct on first try</div>
    </div>
    <h3 class="center">Badges</h3>
    <div class="badges">${badges.map(b => `<div class="badge ${b.on ? '' : 'off'}"><div class="ic">${b.ic}</div><b>${b.n}</b><small>${b.d}</small></div>`).join('')}</div>
    <div class="review">
      <h3 data-read>${missed.length ? '📘 Skills to practice more' : '🌟 You did not miss any questions!'}</h3>
      ${missed.length ? `<ul>${missed.map(m => `<li>${m.label}: ${m.skill}</li>`).join('')}</ul>` : '<p>Amazing work. You are ready for this skill on the FAST!</p>'}
      <p data-read style="margin-bottom:0"><b>Remember:</b> Different authors can write about the same event for different purposes. Ask: Does the author want me to KNOW, DO, or ENJOY? Then look at the details and words the author chose.</p>
    </div>
    ${all.filter(r => r.write).length ? `<div class="review"><h3>✍️ My Written Answers</h3>${all.filter(r => r.write).map(r => `<div class="wresp"><b>${r.label}:</b> ${esc(r.prompt)}${r.img ? `<img src="${r.img}" alt="handwritten answer">` : ''}${r.text ? `<div class="typed">${esc(r.text)}</div>` : ''}</div>`).join('')}</div>` : ''}
    <p class="center" style="font-size:.85rem;color:var(--muted);margin-top:12px">Show this screen to your teacher. Finished on ${new Date().toLocaleDateString()} at ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}.</p>
    <div class="qfoot" style="justify-content:center"><span id="wsay"></span><button class="btn blue" id="againExp">🔁 Try the Expedition Again</button><button class="btn ghost" id="restart">🏕️ Start Over</button></div>
  </div>`;
  $('#wsay').append(sayBtn('🔊 Read to me', () => $('#app')));
  $('#againExp').onclick = () => { S.xp -= R.exp.reduce((a, r) => a + r.pts, 0); S.bananas -= R.exp.filter(r => r.pts).length; updateHUD(); go(4); runExp(); };
  $('#restart').onclick = () => { S.xp = 0; S.bananas = 0; S.unlocked = 0; S.results = { detective: [], same: [], exp: [] }; updateHUD(); go(0); };
  autoRead($('#app'), 'lesson');
}

/* ============================================================
   SETTINGS WIRING
============================================================ */
const setPanel = $('#settings');
$('#gear').onclick = (e) => { e.stopPropagation(); setPanel.classList.toggle('open'); };
$('#closeSet').onclick = () => setPanel.classList.remove('open');
document.addEventListener('click', e => { if(!e.target.closest('#settings') && !e.target.closest('#gear')) setPanel.classList.remove('open'); });
$$('#voiceSeg button').forEach(b => b.onclick = () => {
  $$('#voiceSeg button').forEach(x => x.classList.remove('on')); b.classList.add('on');
  TTS.mode = b.dataset.v; store.set('voice', TTS.mode);
});
const rateNames = r => r < .8 ? 'Extra slow' : r < .95 ? 'Slow' : r < 1.05 ? 'Normal' : 'Fast';
$('#rate').oninput = e => { TTS.rate = +e.target.value; $('#rateLbl').textContent = rateNames(TTS.rate); store.set('rate', TTS.rate); };
$('#autoRead').onchange = e => { TTS.auto = e.target.checked; store.set('auto', TTS.auto); if(!TTS.auto) TTS.stop(); };
$('#sfx').onchange = e => { SFX.on = e.target.checked; store.set('sfx', SFX.on); };
$('#testVoice').onclick = () => {
  TTS.sayText('Hi! I am your reading voice. Let\'s learn about primates!', 'lesson');
};
$('#stopBtn').onclick = () => TTS.stop();
// restore settings
(() => {
  const v = store.get('voice'), r = store.get('rate'), a = store.get('auto'), s = store.get('sfx');
  if(v){ TTS.mode = v; $$('#voiceSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
  if(r){ TTS.rate = r; $('#rate').value = r; }
  $('#rateLbl').textContent = rateNames(TTS.rate);
  if(a === false){ TTS.auto = false; $('#autoRead').checked = false; }
  if(s === false){ SFX.on = false; $('#sfx').checked = false; }
  if(!TTS.ok) $('#voiceNote').textContent = 'Read-aloud is not available in this browser. Try Chrome or Safari.';
})();

Draw.init(); $('#drawBtn').onclick = e => { e.stopPropagation(); Draw.toggle(); };
updateHUD(); drawMap(); screenHome();
</script>
